    // Helper: given an item_order, return the corresponding quad (array of 4 grid filenames).
    function getQuadForItemOrder(item_ord) {
        var idx = parseInt(item_ord);
        // If idx is a valid index into randomised_quads, return that
        if (!isNaN(idx) && idx >= 0 && idx < randomised_quads.length) {
            return randomised_quads[idx];
        }
        // If it's a practice item_order (>= practice_item_order_base), map it to the appended practice quads
        if (!isNaN(idx) && idx >= practice_item_order_base) {
            var practiceIndex = practice_quad_start_index + (idx - practice_item_order_base);
            if (practiceIndex >= 0 && practiceIndex < randomised_quads.length) {
                return randomised_quads[practiceIndex];
            }
        }
        // Fallback: return the last quad (should be a practice quad)
        return randomised_quads[randomised_quads.length - 1];
    }

    // Function to sample items for a predicate block ensuring balanced true/false and conflict/non-conflict
    function sampleItemsForPredicate(conflictItems, nonConflictItems) {
        // From conflict items, get 5 true and 5 false statements
        const conflictTrue = conflictItems.filter(item => item.correct_response === 'T');
        const conflictFalse = conflictItems.filter(item => item.correct_response === 'F');
        
        // From non-conflict items, get 5 true and 5 false statements
        const nonConflictTrue = nonConflictItems.filter(item => item.correct_response === 'T');
        const nonConflictFalse = nonConflictItems.filter(item => item.correct_response === 'F');
        
        // Sample 5 items from each category
        const sampledConflictTrue = jsPsych.randomization.sampleWithoutReplacement(conflictTrue, 5);
        const sampledConflictFalse = jsPsych.randomization.sampleWithoutReplacement(conflictFalse, 5);
        const sampledNonConflictTrue = jsPsych.randomization.sampleWithoutReplacement(nonConflictTrue, 5);
        const sampledNonConflictFalse = jsPsych.randomization.sampleWithoutReplacement(nonConflictFalse, 5);
        
        // Combine all samples and randomize the order
        return jsPsych.randomization.shuffle([
            ...sampledConflictTrue,
            ...sampledConflictFalse,
            ...sampledNonConflictTrue,
            ...sampledNonConflictFalse
        ]);
    }

            jsPsych.data.addProperties({ age: responses.age });
            jsPsych.data.addProperties({ country: responses.country });
            jsPsych.data.addProperties({ issues: responses.issues });
        }
    };

    //gender 
    var gender_options = ["Male", "Female", "Non-binary", "Other/prefer not to say"];
    var gender = {
        type: jsPsychSurveyMultiChoice,
        preamble: '<p> Please answer the following quesions </p>',
        data: { task: 'demographics_gender' },
        questions: [{ prompt: "What is your gender?", name: 'gender', options: gender_options, required: true }],
        on_finish: function (data) {
            var responses = data.response;
            jsPsych.data.addProperties({ gender: responses.gender })
        }
    };

    //education level
    var education_options = ["Less than High School", "High School / GED", "Bachelor Degree", "Master Degree", "Doctoral Degree"];
    var education_level = {
        type: jsPsychSurveyMultiChoice,
        preamble: '<p> Please answer the following question </p>',
        data: { task: 'demographics_education' },
        questions: [{ prompt: "What is the highest level of education you have completed?", name: 'education_level', options: education_options, required: true }],
        button_label: 'Next',
        on_finish: function (data) {
            var responses = data.response;
            jsPsych.data.addProperties({ education_level: responses.education_level })
        }
    };

    //debrief
    var debrief = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `<p>You're all done!</p>` + debrief_text + `<p></p> Thank you for participating!</p>`,
        choices: ['Finish']
    };

    ///////////////////////////////////////////_______________________________________________________
    //////////// THE TIMELINE //////////////////______________________________________________________


    var preload2 = {
        type: jsPsychPreload,
        images: ['hand_positions.png', 'hand_positions_fingers.png', 'hand_positions_grid.png', 'hand_positions_thumbs.png'],
        show_progress_bar: true,
        show_detailed_errors: true,
        message: 'Please wait while the experiment loads.</p><p>WARNING: Do not refresh the page at any point during loading or throughout the study.</p>'
    };

    // Setup Phase: Load resources and enter fullscreen
    timeline.push(
        preload2,
        enter_fullscreen,
        consent,
        instructions1,
        cursor_off
    );

    // Keyboard and response/confidence key instructions
    timeline.push(hands1, hands2, hands3);

    // Practice trials in the single-response format
    timeline.push(
        // Instructions for first practice phase (advance with C or N)
        {
            type: jsPsychHtmlKeyboardResponse,
            on_start: function() {
                attachKeyListeners("trial_response1");
            },
            stimulus: '<div class="centered-content">' + window.instructions.instr_practice_1 + '</div>',
            choices: ['c', 'n'],
            prompt: function() {
                var choiceBox1 = $('<div>').addClass('choice-box').text('C');
                var choiceBox2 = $('<div>').addClass('choice-box').text('N');
                var promptContainer = $('<div>').addClass('prompt-container').append(choiceBox1).append(choiceBox2);
                return promptContainer.prop('outerHTML');
            },
            on_finish: function() {
                removeKeyListeners();
            }
        },
        practice_procedure1,  // Six simple trials: single statement, no time limit
        after_prac1
    );

    // Reminder before starting the main task
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        on_start: function() {
            attachKeyListeners("trial_response1");
        },
        stimulus: '<div class="centered-content">' + window.instructions.instr_main_task + '</div>',
        choices: ['c', 'n'],
        prompt: function() {
            var choiceBox1 = $('<div>').addClass('choice-box').text('C');
            var choiceBox2 = $('<div>').addClass('choice-box').text('N');
            var promptContainer = $('<div>').addClass('prompt-container').append(choiceBox1).append(choiceBox2);
            return promptContainer.prop('outerHTML');
        },
        on_finish: function() {
            removeKeyListeners();
        }
    });

    // Main Experimental Blocks
    var break_screen = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function() {
            return '<div class="centered-content">' + window.instructions.instr_break + '</div>';
        },
        choices: ['c', 'n'],
        prompt: function () {
            var choiceBox1 = $('<div>').addClass('choice-box').text('C');
            var choiceBox2 = $('<div>').addClass('choice-box').text('N');
            var promptContainer = $('<div>').addClass('prompt-container').append(choiceBox1).append(choiceBox2);
            return promptContainer.prop('outerHTML');
        }
    };

    // Create block procedures based on randomized order
    var block_procedures = blocks.map(function(block, index) {
        var blockNumber = index + 1;
        var blockTopicScreen = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                return '<div class="centered-content">' +
                    window.instructions.getBlockTopicInstr(block.topic, blockNumber, blocks.length) +
                    '</div>';
            },
            choices: ['c', 'n'],
            prompt: function () {
                var choiceBox1 = $('<div>').addClass('choice-box').text('C');
                var choiceBox2 = $('<div>').addClass('choice-box').text('N');
                var promptContainer = $('<div>').addClass('prompt-container').append(choiceBox1).append(choiceBox2);
                return promptContainer.prop('outerHTML');
            }
        };
        var blockProcedure = {
            timeline: [
                item_start,
                fixation, 
                trial_single_response,
                gap,
                confidence_single
            ],
            timeline_variables: block.block,
            data: { block: block.name, blockNumber: blockNumber }
        };
        return [blockTopicScreen, blockProcedure];
    });

    // Flatten and add all block procedures to timeline in randomized order
    block_procedures.forEach(function(pair, index) {
        timeline.push(...pair);
        if (index === 2) {
            timeline.push(break_screen);
        }
    });

    // Wrap-up
    timeline.push(
        cursor_on,
        end_trials,
        age,
        gender,
        education_level,
        debrief,
        exit_fullscreen
    );

    // timeline.push(block1_procedure, feedback, block2_procedure, cursor_on, end_trials, age, gender, pro, debrief);

    jatos.onLoad(() => {
        jsPsych.run(timeline);
    });


</script>

</html>
