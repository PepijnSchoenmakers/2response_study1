            //console.log('Confidence Response:', data.confidenceResponse);
        }
    };


    //confidence rating second response
    var confidence2 = {
        confidenceResponse2: null,
        type: jsPsychHtmlKeyboardResponse,
        stimulus: jsPsych.timelineVariable('conf_stimulus'),
        choices: ['1', '2', '3', '8', '9', '0', '&', 'é', '"', '_', '!', 'ç', 'à'],
        prompt: function () {
            // Create choice boxes with jQuery
            var choiceBox1 = $('<div>').addClass('choice-box').text('1');
            var choiceBox2 = $('<div>').addClass('choice-box').text('2');
            var choiceBox3 = $('<div>').addClass('choice-box').text('3');
            var choiceBox4 = $('<div>').addClass('choice-box').text('4');
            var choiceBox5 = $('<div>').addClass('choice-box').text('5');
            var choiceBox6 = $('<div>').addClass('choice-box').text('6');

            // Create a container div and append choice boxes
            var promptContainer = $('<div>').addClass('prompt-container').append(choiceBox1)
                .append(choiceBox2).append(choiceBox3).append(choiceBox4).append(choiceBox5).append(choiceBox6);

            // Use prop() to get the HTML content of the jQuery object
            return promptContainer.prop('outerHTML');
        },
        data: {
            task: 'confidence_question2',
            item: jsPsych.timelineVariable('item'),
            correct_response: jsPsych.timelineVariable('correct_response'),
            question_type: jsPsych.timelineVariable('QuestionType'),
            item_order: jsPsych.timelineVariable('item_order'),
        },
        on_finish: function (data) {
            console.log('Key Press:', data.response);
            // Set the confidence response based on the key pressed
            switch (data.response) {
                case '1': case '&': data.confidenceResponse2 = 1; break; // '1' or '&'
                case '2': case 'é': data.confidenceResponse2 = 2; break; // '2' or 'é'
                case '3': case '"': data.confidenceResponse2 = 3; break; // '3' or '"'
                case '8': case '_': case '!': data.confidenceResponse2 = 4; break; // '4' or '_'
                case '9': case 'ç': data.confidenceResponse2 = 5; break; // '5' or 'ç' 
                case '0': case 'à': data.confidenceResponse2 = 6; break; // '6' or 'à' 
                default: data.confidenceResponse2 = null; break;
            }

            // Log all trial data to the console
            //console.log('Key Press:', data.response);
            //console.log('Confidence Response:', data.confidenceResponse2);
        }
    };

    //create procedures for practice, block1, feedback, block2)

    var practice_procedure1 = {
        timeline: [fixation_practice, trial_keyboard, confidence],
        timeline_variables: trial_info_practice1,
        randomize_order: true,
        data: { block: 'blockPractice1' }
    };

    var practice_procedure2 = {
        timeline: [fixation_practice, trial_timed, confidence,trial_keyboard, confidence2],
        timeline_variables: trial_info_practice2,
        randomize_order: true,
        data: { block: 'blockPractice2' }
    };

    var practice_procedure3 = {
        timeline: [fixation_practice, grid_display, trial_timed, confidence, grid_answer, grid_feedback, trial_keyboard, confidence2],
        timeline_variables: trial_info_practice3,
        randomize_order: true,
        data: { block: 'blockPractice3' }
    };

    var block1_procedure = {
        timeline: [fixation, grid_display, trial_timed, confidence, grid_answer, grid_feedback, trial_keyboard, confidence2],
        timeline_variables: trial_info_set.slice(0, 36),
        data: { block: 'block1' }
    };

    var feedback = {
        type: jsPsychImageKeyboardResponse,
        on_start: feedback_background,
        stimulus_height: 300,
        stimulus: feedback_image,
        prompt: [feedback_text],
        choices: ['c', 'n']
    };

    var block2_procedure = {
        timeline: [fixation, grid_display, trial_timed, confidence, grid_answer, grid_feedback, trial_keyboard, confidence2],
        timeline_variables: trial_info_set.slice(36),
        data: { block: 'block2' }
    };


    //end of main task
    var end_trials = {
        type: jsPsychHtmlButtonResponse,
        stimulus: ['Well done!<p>You completed the main part of the experiment.</p><p>Before you go, please answer some short demographic questions.</p>'],
        choices: ['Next'],
    };

    //age and country
    var age = {
        type: jsPsychSurveyText,
        preamble: '<p> Please answer the following quesions </p>',
        questions: [{ prompt: '<p> What is your age in years? </p>', name: 'age', columns: 2, required: true },
        { prompt: '<p> In what country do you currently reside? </p>', name: 'country', columns: 20, required: true },
        { prompt: '<p> Do you have any comments for the researchers? For example, were there any technical issues during the experiment. </p>', name: 'issues', columns: 130, required: false }],
        on_finish: function (data) {
            var responses = data.response;
            jsPsych.data.addProperties({ age: responses.age });
            jsPsych.data.addProperties({ country: responses.country });
            jsPsych.data.addProperties({ issues: responses.issues });
        }
    };

    //gender
    var gender_options = ["Male", "Female", "Non-binary", "Other/prefer not to say"];
    var gender = {
        type: jsPsychSurveyMultiChoice,
        preamble: '<p> Please answer the following quesions </p>',
        questions: [{ prompt: "What is your gender?", name: 'gender', options: gender_options, required: true }],
        on_finish: function (data) {
            var responses = data.response;
            jsPsych.data.addProperties({ gender: responses.gender })
        }
    };

    //prolific id
    var pro = {
        type: jsPsychSurveyText,
        preamble: '<p> <p> Please answer the following quesion </p>',
        questions: [{ prompt: '<p> What is your prolific ID? </p>', name: 'pro_id', columns: 30, required: true }],
        button_label: 'Next',
        on_finish: function (data) {
            var responses = data.response;
            jsPsych.data.addProperties({ pro_id: responses.pro_id })
        }
    };

    //debrief
    var debrief = {
        type: jsPsychHtmlButtonResponse,
        stimulus: function () {
            var trials = jsPsych.data.get().filter({ task: 'reasoning_problem' });
            var correct_trials = trials.filter({ accuracy: true });
            var accuracy = Math.round(correct_trials.count() / trials.count() * 100);

            return (`<p>You're all done!</p>` + debrief_text + `<p></p> Thank you for participating!</p>`);
        },
        choices: ['Finish']
    };

    ///////////////////////////////////////////_______________________________________________________
    //////////// THE TIMELINE //////////////////______________________________________________________


    var preload = {
        type: jsPsychPreload,
        auto_preload: true, // automatically preload the image and audio files
        images: grid_list, // manually preload the images used with timeline variables,
        show_detailed_errors: true
    }

    timeline.push(consent, instructions1, hands1, hands2, hands3, instructions2, instructions3, cursor_off,
        practice_procedure1, after_prac1, practice_procedure2, after_prac2, practice_procedure3, after_prac3,
        block1_procedure, feedback, block2_procedure, cursor_on,
        end_trials, age, gender, pro, debrief);


    jatos.onLoad(() => {
        jsPsych.run(timeline);
    });


</script>
