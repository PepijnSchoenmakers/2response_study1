    // Helper: given an item_order, return the corresponding quad (array of 4 grid filenames).
    function getQuadForItemOrder(item_ord) {
        var idx = parseInt(item_ord);
        // If idx is a valid index into randomised_quads, return that
        if (!isNaN(idx) && idx >= 0 && idx < randomised_quads.length) {
            return randomised_quads[idx];
        }
        // If it's a practice item_order (>= practice_item_order_base), map it to the appended practice quads
        if (!isNaN(idx) && idx >= practice_item_order_base) {
            var practiceIndex = practice_quad_start_index + (idx - practice_item_order_base);
            if (practiceIndex >= 0 && practiceIndex < randomised_quads.length) {
                return randomised_quads[practiceIndex];
            }
        }
        // Fallback: return the last quad (should be a practice quad)
        return randomised_quads[randomised_quads.length - 1];
    }

    // Function to sample items for a predicate block ensuring balanced true/false and conflict/non-conflict
    function sampleItemsForPredicate(conflictItems, nonConflictItems) {
        // From conflict items, get 5 true and 5 false statements
        const conflictTrue = conflictItems.filter(item => item.correct_response === 'T');
        const conflictFalse = conflictItems.filter(item => item.correct_response === 'F');
        
        // From non-conflict items, get 5 true and 5 false statements
        const nonConflictTrue = nonConflictItems.filter(item => item.correct_response === 'T');
        const nonConflictFalse = nonConflictItems.filter(item => item.correct_response === 'F');
        
        // Sample 5 items from each category
        const sampledConflictTrue = jsPsych.randomization.sampleWithoutReplacement(conflictTrue, 5);
        const sampledConflictFalse = jsPsych.randomization.sampleWithoutReplacement(conflictFalse, 5);
        const sampledNonConflictTrue = jsPsych.randomization.sampleWithoutReplacement(nonConflictTrue, 5);
        const sampledNonConflictFalse = jsPsych.randomization.sampleWithoutReplacement(nonConflictFalse, 5);
        
        // Combine all samples and randomize the order
        return jsPsych.randomization.shuffle([
            ...sampledConflictTrue,
            ...sampledConflictFalse,
            ...sampledNonConflictTrue,
            ...sampledNonConflictFalse
        ]);
    }

        data: { block: 'blockPractice1' }
    };

    var practice_procedure2 = {
        timeline: [item_start_practice, fixation, trial_pre1, trial_pre2, trial_response1, gap, confidence1, gap, inter_trial, trial_response2, gap, confidence2, gap],
        timeline_variables: fixed_practice_trials_phase2,
        randomize_order: false,
        data: { block: 'blockPractice2' }
    };

    var practice_procedure3 = {
        timeline: [item_start_practice, grid_display, grid_answer, grid_feedback, gap],
        timeline_variables: fixed_practice_trials_phase3,
        randomize_order: false,
        data: { block: 'blockPractice3' }
    };

    var practice_procedure4 = {
        timeline: [item_start_practice, fixation, grid_display, trial_pre1, trial_pre2, trial_response1, gap, confidence1, gap, grid_answer, grid_feedback, trial_response2, gap, confidence2, gap],
        timeline_variables: fixed_practice_trials_phase4,
        randomize_order: false,
        data: { block: 'blockPractice4' }
    };

    // Create procedures for each of the 6 blocks
    var temperature_procedure = {
        timeline: [item_start, fixation, grid_display, trial_pre1, trial_pre2, trial_response1, gap, confidence1, gap, grid_answer, grid_feedback, trial_response2, gap, confidence2, gap],
        timeline_variables: temperature_block,
        data: { block: 'temperature' }
    };

    var space_procedure = {
        timeline: [item_start, fixation, grid_display, trial_pre1, trial_pre2, trial_response1, gap, confidence1, gap, grid_answer, grid_feedback, trial_response2, gap, confidence2, gap],
        timeline_variables: space_block,
        data: { block: 'space' }
    };

    var weight_procedure = {
        timeline: [item_start, fixation, grid_display, trial_pre1, trial_pre2, trial_response1, gap, confidence1, gap, grid_answer, grid_feedback, trial_response2, gap, confidence2, gap],
        timeline_variables: weight_block,
        data: { block: 'weight' }
    };

    var nutrient_procedure = {
        timeline: [item_start, fixation, grid_display, trial_pre1, trial_pre2, trial_response1, gap, confidence1, gap, grid_answer, grid_feedback, trial_response2, gap, confidence2, gap],
        timeline_variables: nutrient_block,
        data: { block: 'nutrient' }
    };

    var reproduction_procedure = {
        timeline: [item_start, fixation, grid_display, trial_pre1, trial_pre2, trial_response1, gap, confidence1, gap, grid_answer, grid_feedback, trial_response2, gap, confidence2, gap],
        timeline_variables: reproduction_block,
        data: { block: 'reproduction' }
    };

    var respiration_procedure = {
        timeline: [item_start, fixation, grid_display, trial_pre1, trial_pre2, trial_response1, gap, confidence1, gap, grid_answer, grid_feedback, trial_response2, gap, confidence2, gap],
        timeline_variables: respiration_block,
        data: { block: 'respiration' }
    };


    //end of main task
    var end_trials = {
        type: jsPsychHtmlButtonResponse,
        stimulus: ['Well done!<p>You completed the main part of the experiment.</p><p>Before you go, please answer some short demographic questions.</p>'],
        choices: ['Next'],
    };

    //age and country
    var age = {
        type: jsPsychSurveyText,
        preamble: '<p> Please answer the following quesions </p>',
        questions: [{ prompt: '<p> What is your age in years? </p>', name: 'age', columns: 2, required: true },
        { prompt: '<p> In what country do you currently reside? </p>', name: 'country', columns: 20, required: true },
        { prompt: '<p> Do you have any comments for the researchers? For example, were there any technical issues during the experiment. </p>', name: 'issues', columns: 130, required: false }],
        on_finish: function (data) {
            var responses = data.response;
            jsPsych.data.addProperties({ age: responses.age });
            jsPsych.data.addProperties({ country: responses.country });
            jsPsych.data.addProperties({ issues: responses.issues });
        }
    };

    //gender 
    var gender_options = ["Male", "Female", "Non-binary", "Other/prefer not to say"];
    var gender = {
        type: jsPsychSurveyMultiChoice,
        preamble: '<p> Please answer the following quesions </p>',
        questions: [{ prompt: "What is your gender?", name: 'gender', options: gender_options, required: true }],
        on_finish: function (data) {
            var responses = data.response;
            jsPsych.data.addProperties({ gender: responses.gender })
        }
    };

    //prolific id
    var pro = {
        type: jsPsychSurveyText,
        preamble: '<p> <p> Please answer the following quesion </p>',
        questions: [{ prompt: '<p> What is your prolific ID? </p>', name: 'pro_id', columns: 30, required: true }],
        button_label: 'Next',
        on_finish: function (data) {
            var responses = data.response;
            jsPsych.data.addProperties({ pro_id: responses.pro_id })
        }
    };

    //debrief
    var debrief = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `<p>You're all done!</p>` + debrief_text + `<p></p> Thank you for participating!</p>`,
        choices: ['Finish']
    };

    ///////////////////////////////////////////_______________________________________________________
    //////////// THE TIMELINE //////////////////______________________________________________________


    var preload1 = {
        type: jsPsychPreload,
        images: grid_list, // Preload grid images
        show_progress_bar: true,
        show_detailed_errors: true,
        message: '<p>Please wait while the experiment loads.</p><p>WARNING: Do not refresh the page at any point during loading or throughout the study.</p>'
    };

    var preload2 = {
        type: jsPsychPreload,
        images: ['hand_positions.png', 'hand_positions_fingers.png', 'hand_positions_grid.png', 'hand_positions_thumbs.png'],
        show_progress_bar: true,
        show_detailed_errors: true,
        message: 'Please wait while the experiment loads.</p><p>WARNING: Do not refresh the page at any point during loading or throughout the study.</p>'
    };

    // Setup Phase: Load resources and enter fullscreen
    timeline.push(
        preload1,
        preload2,
        enter_fullscreen,
        consent,
        instructions1,
        cursor_off
    );

    // Training Phase 1: Keyboard and Response Instructions
    timeline.push(
        hands1,  // Keyboard finger placement
        hands2,  // C/N response keys
        hands3   // Confidence rating keys
    );

    // Training Phase 2: Simple Practice (no time limit, no confidence, single statement)
    timeline.push(
        // Instructions for first practice phase (advance with C or N)
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: window.instructions.instr_practice_1,
            choices: ['c', 'n'],
            prompt: function() {
                var choiceBox1 = $('<div>').addClass('choice-box').text('C');
                var choiceBox2 = $('<div>').addClass('choice-box').text('N');
                var promptContainer = $('<div>').addClass('prompt-container').append(choiceBox1).append(choiceBox2);
                return promptContainer.prop('outerHTML');
            }
        },
        practice_procedure1,  // Two simple trials: single statement, no confidence
        after_prac1
    );

    // Training Phase 3: Two-Response Format Practice (no grid yet)
    timeline.push(
        // Instructions for two-response format (advance with C or N)
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: window.instructions.instr_practice_2,
            choices: ['c', 'n'],
            prompt: function() {
                var choiceBox1 = $('<div>').addClass('choice-box').text('C');
                var choiceBox2 = $('<div>').addClass('choice-box').text('N');
                var promptContainer = $('<div>').addClass('prompt-container').append(choiceBox1).append(choiceBox2);
                return promptContainer.prop('outerHTML');
            }
        },
        practice_procedure2,  // Two trials: first response with time limit + confidence, second response no limit + confidence
        after_prac2
    );

    // Training Phase 4: Grid Memorization Practice (grid only, no statements)
    timeline.push(
        hands5,  // Grid key instructions with image and intro text
        practice_procedure3  // Two trials: grid memorization only
    );

    // Training Phase 5: Full Practice (Two-Response + Grid)
    timeline.push(
        // Instructions for full task format (grid + two-response + confidence)
        {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<p>Now you will practice the complete task: memorizing the grid while giving your two responses.</p><p>Press C or N to continue.</p>',
            choices: ['c', 'n'],
            prompt: function() {
                var choiceBox1 = $('<div>').addClass('choice-box').text('C');
                var choiceBox2 = $('<div>').addClass('choice-box').text('N');
                var promptContainer = $('<div>').addClass('prompt-container').append(choiceBox1).append(choiceBox2);
                return promptContainer.prop('outerHTML');
            }
        },
        practice_procedure4,  // Two complete trials with grids and two-response format
        after_prac3
    );

    // Main Experimental Blocks
    // Create block procedures based on randomized order
    var block_procedures = blocks.map(function(block) {
        var blockTopicScreen = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                return '<div id="stimulus_container" class="stimulus-container">' +
                    window.instructions.getBlockTopicInstr(block.topic) +
                    '</div>';
            },
            choices: ['c', 'n'],
            prompt: function () {
                var choiceBox1 = $('<div>').addClass('choice-box').text('C');
                var choiceBox2 = $('<div>').addClass('choice-box').text('N');
                var promptContainer = $('<div>').addClass('prompt-container').append(choiceBox1).append(choiceBox2);
                return promptContainer.prop('outerHTML');
            }
        };
        var blockProcedure = {
            timeline: [
                item_start,
                fixation, 
                grid_display, 
                trial_pre1, 
                trial_pre2, 
                trial_response1, 
                gap, 
                confidence1, 
                gap, 
                grid_answer, 
                grid_feedback, 
                trial_response2, 
                gap, 
                confidence2, 
                gap
            ],
            timeline_variables: block.block,
            data: { block: block.name }
        };
        return [blockTopicScreen, blockProcedure];
    });

    // Flatten and add all block procedures to timeline in randomized order
    block_procedures.forEach(function(pair) {
        timeline.push(...pair);
    });

    // Wrap-up
    timeline.push(
        cursor_on,
        end_trials,
        age,
        gender,
        pro,
        debrief,
        exit_fullscreen
    );

    // timeline.push(block1_procedure, feedback, block2_procedure, cursor_on, end_trials, age, gender, pro, debrief);

    jatos.onLoad(() => {
        jsPsych.run(timeline);
    });


</script>
